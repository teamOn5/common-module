name: Publish packages to GitHub Packages

# main 에 push 되면 모듈별로 마지막 태그 이후 변경사항을 감지해 바뀐 모듈만 배포한다.
#   태그: 루트(common-module) 는 v1.2.3, 하위 모듈은 <모듈명>-v1.2.3
#   해당 모듈 디렉토리 또는 공통 빌드 파일(build.gradle, settings.gradle, gradle.properties, gradle/)을
#   건드린 커밋의 메시지(Conventional Commits)로 모듈별 버전을 결정
#     feat!: / fix!: ... 또는 본문에 "BREAKING CHANGE"  → major
#     feat: ...                                         → minor
#     fix: ... / perf: ...                              → patch
#     그 외 (docs:, chore:, refactor:, test:, ci: ...)  → 배포하지 않음
# 상세 로직은 .github/scripts/release-plan.sh 참고
# 필요하면 Actions 탭 → Run workflow 에서 모듈/버전을 지정해 수동 실행 가능
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'auto: 커밋 메시지로 결정 / 그 외: 강제 지정'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      modules:
        description: '대상 모듈 (쉼표 구분, 비우면 전체. 예: common-core,common-web)'
        type: string
        default: ''

# 동시에 두 번 실행되어 같은 버전이 계산되는 것을 방지
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 태그, Release 생성
      packages: write   # GitHub Packages 배포
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 기존 태그와 커밋 히스토리 조회

      - name: Calculate release plan
        id: plan
        env:
          BUMP_INPUT: ${{ inputs.bump || 'auto' }}
          MODULES_INPUT: ${{ inputs.modules || '' }}
        run: |
          bash .github/scripts/release-plan.sh "$BUMP_INPUT" "$MODULES_INPUT"
          if [ -s release-plan.txt ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.plan.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        if: steps.plan.outputs.skip == 'false'

      - name: Build and test
        if: steps.plan.outputs.skip == 'false'
        run: ./gradlew build $(cat gradle-args.txt | tr ' ' '\n' | grep '^-P' | tr '\n' ' ')

      - name: Publish changed modules
        if: steps.plan.outputs.skip == 'false'
        run: ./gradlew $(cat gradle-args.txt)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 배포가 성공한 모듈에만 태그와 Release 를 남긴다 (노트는 해당 모듈 경로의 커밋만)
      - name: Create tags and releases
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS='|' read -r module version tag prev paths; do
            [ -z "$module" ] && continue
            if [ -n "$prev" ]; then range="${prev}..HEAD"; else range="HEAD"; fi
            read -ra path_list <<< "$paths"
            git log "$range" --format='- %s (%h)' -- "${path_list[@]}" \
              build.gradle settings.gradle gradle.properties gradle > notes.md
            [ -s notes.md ] || echo "- 변경 내역 없음 (수동 배포)" > notes.md
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "${module} v${version}" \
              --notes-file notes.md
          done < release-plan.txt
